# Render Blueprint for the API. The web app is deployed separately on Vercel (see README).
services:
  - type: web
    name: roomie-scoreboard-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev because the TypeScript compiler is a dev dependency.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Behind Render's proxy, so rate limits see the real client IP.
      - key: TRUST_PROXY
        value: "1"
      # Generated by Render, never stored in the repo.
      - key: JWT_SECRET
        generateValue: true
      # Your MongoDB Atlas connection string. Render asks for it when you create the service.
      - key: MONGODB_URI
        sync: false
      # The web app's address, e.g. https://roomie-scoreboard.vercel.app (no trailing slash).
      - key: CLIENT_ORIGIN
        sync: false
